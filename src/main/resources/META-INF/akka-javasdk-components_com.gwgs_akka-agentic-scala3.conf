# Akka component descriptor — hand-maintained.
#
# The Akka SDK normally generates this at compile time via a javac annotation
# processor (akka-javasdk-annotation-processor). That processor only sees JAVA
# sources, but our components are written in Scala, so it never discovers them.
# We therefore declare them here by hand. ComponentLocator globs
# META-INF/akka-javasdk-components_*.conf and reads each component type as a list
# of fully-qualified class names.
#
# ⚠️ Add every new Scala component here (by type) when you create it.
akka.javasdk.components {
  # cap-1 (Scala) + cap-2 (Java, com.gwgs.akkaagentic.team.*). The team components are Java but
  # are still listed by hand: the annotation processor is disabled (-proc:none) so it can't
  # regenerate-and-overwrite this file. See specs/004 research R2.
  agent = [
    "com.gwgs.akkaagentic.application.GreetingAgent",
    "com.gwgs.akkaagentic.team.application.ToneAgent",
    "com.gwgs.akkaagentic.team.application.GreetingComposerAgent",
    # cap-4 (Scala) — multi-turn chat. A plain request-based Agent; session memory is provided by
    # the SDK's internal SessionMemoryEntity, which the runtime registers itself — so there is NO
    # entry for it here, only the agent. See specs/006 research R3.
    "com.gwgs.akkaagentic.chat.application.ChatAgent",
    # cap-6 (Scala) — agent-to-agent delegation. A request-based assistant per username: chat history
    # via session memory (username = session id), to-dos via the Java TodoEntity through a Java tool
    # object, and delegation to another user's assistant via agent dynamicCall (research R1). This is
    # the SDK-discouraged "agent chaining" path taken deliberately in Scala (research R7).
    "com.gwgs.akkaagentic.a2a.application.PersonalAssistantAgent",
    # cap-7 (Scala) — activity delegation. Request-based specialists the ActivityCoordinator delegates
    # to via Delegation.to(...). A request-based Agent is a valid delegation worker (Agent implements
    # AgentDelegationWorker; specs/009 research D1, verified live in T006).
    "com.gwgs.akkaagentic.activities.application.WeatherSpecialist",
    "com.gwgs.akkaagentic.activities.application.ActivitySpecialist",
    # cap-8 (Scala) — RAG. A request-based agent that answers grounded ONLY in passages retrieved
    # (by the endpoint) from the in-process vector store; returns a bare String (no Java-shaped
    # result), citing sources endpoint-side. See specs/010 research R3/R4.
    "com.gwgs.akkaagentic.docs.application.DocsAgent",
    # cap-10 (Scala) — MCP client. A request-based agent that grounds via a REMOTE MCP tool
    # (.mcpTools(RemoteMcpTools.fromService(...))) pointed at THIS service's own cap-9 /mcp server —
    # the model decides whether/when to call `retrieve` (agentic RAG). Consuming a remote MCP server
    # is Scala-clean: RemoteMcpTools is a URL-string builder, no method-ref wall (cap-10 R1). See
    # specs/012 research R1.
    "com.gwgs.akkaagentic.mcpclient.application.McpClientAgent",
    # cap-13 (Scala) — an LLM-as-judge evaluator we author. An evaluator is an ORDINARY agent, so
    # unlike cap-12's guardrails (registered by config, no descriptor entry) it needs a line here.
    # The SDK's three built-in evaluators are deliberately absent: they are provided components
    # registered by ComponentLocator, like SessionMemoryEntity. See specs/015 research R1c/R2.
    "com.gwgs.akkaagentic.eval.application.DeclineJudge"
  ]
  http-endpoint = [
    "com.gwgs.akkaagentic.api.GreetingEndpoint",
    "com.gwgs.akkaagentic.api.HealthEndpoint",
    "com.gwgs.akkaagentic.team.api.GreetingTeamEndpoint",
    "com.gwgs.akkaagentic.assistant.api.HelpDeskEndpoint",
    "com.gwgs.akkaagentic.chat.api.ChatEndpoint",
    "com.gwgs.akkaagentic.approvals.api.ApprovalEndpoint",
    # cap-6 (Scala) — POST /request/{username}, synchronous. Validates then calls PersonalAssistantAgent.
    "com.gwgs.akkaagentic.a2a.api.PersonalAssistantEndpoint",
    # cap-7 (Scala) — POST /activities, GET /activities/{taskId}, start-then-poll.
    "com.gwgs.akkaagentic.activities.api.ActivityEndpoint",
    # cap-8 (Scala) — POST /ask, synchronous RAG-grounded Q&A. Injects ComponentClient + the
    # custom KnowledgeStore dependency (provided by Bootstrap's DependencyProvider). See specs/010.
    "com.gwgs.akkaagentic.docs.api.DocsEndpoint",
    # cap-10 (Scala) — POST /grounded-ask, synchronous agentic RAG. Validates then calls
    # McpClientAgent, whose model grounds via the remote `retrieve` MCP tool (this service's own cap-9
    # /mcp). No citations (the model owns retrieval — the cap-8-fork tradeoff). See specs/012.
    "com.gwgs.akkaagentic.mcpclient.api.McpClientEndpoint",
    # cap-11 (JAVA, in an otherwise-Scala capability) — GET /todo-summaries/..., read-only. It is Java
    # because ViewClient is method-reference-only (.method(TodoSummaryView::getByUsername)) with no
    # dynamicCall, so a Scala lambda can never resolve — the same wall as cap-2's WorkflowClient and
    # cap-6's entity client. Note the View COMPONENT itself is Scala: the wall claims only the caller.
    # See specs/013 research R1.
    "com.gwgs.akkaagentic.todos.api.TodoSummaryEndpoint",
    # cap-13 (Scala) — POST /evaluate, synchronous LLM-as-judge evaluation over cap-8's pipeline.
    # Injects ComponentClient + the same KnowledgeStore cap-8/cap-9 use. Capability 8 is NOT modified;
    # this surface exists because the SDK has no interaction-completion source for a request-based
    # agent (specs/015 research R4).
    "com.gwgs.akkaagentic.eval.api.EvaluationEndpoint"
  ]
  workflow = ["com.gwgs.akkaagentic.team.application.GreetingWorkflow"]
  # cap-11 (Scala) — the to-do read model. The View COMPONENT is Scala; its TableUpdater lives in the
  # companion object because the SDK instantiates updaters via getDeclaredConstructor() + newInstance()
  # and a Scala *inner* class has no zero-arg constructor (only Updater($outer)) — a bytecode-shape
  # requirement, not an API one. See specs/013 research R2. The `view` key is confirmed from the SDK's
  # ComponentType constant pool (research R4). The querying ENDPOINT is Java: ViewClient is
  # method-reference-only with no dynamicCall (research R1).
  view = ["com.gwgs.akkaagentic.todos.application.TodoSummaryView"]
  # cap-9 (Scala) — MCP server. An @McpEndpoint is an endpoint (no @Component), invoked reflectively
  # from JSON-RPC — no ComponentClient method-ref, so it's Scala-clean (like HTTP endpoints). The
  # `mcp-endpoint` key is confirmed from the SDK's ComponentType constant pool. It injects the cap-8
  # KnowledgeStore (custom DI via Bootstrap) and exposes a `retrieve` tool over /mcp. See specs/011 R1.
  mcp-endpoint = ["com.gwgs.akkaagentic.mcp.api.KnowledgeMcpEndpoint"]
  # cap-6 (Java) — agent-to-agent delegation. The per-user TODO store. It is Java because the
  # KeyValueEntity client is method-reference-only (no dynamicCall), so it is reached only from the
  # Java TodoTools tool object, never from the Scala agent directly. See specs/008 research R2.
  # (SessionMemoryEntity backing cap-6's chat history stays runtime-owned, so it is NOT listed.)
  key-value-entity = ["com.gwgs.akkaagentic.a2a.application.TodoEntity"]
  # cap-3 (Scala) — Autonomous Agent. Distinct `autonomous-agent` key (confirmed from the annotation
  # processor's constant pool), not the plain `agent` key. See specs/005 research R2.
  autonomous-agent = [
    "com.gwgs.akkaagentic.assistant.application.HelpDeskAgent",
    # cap-5 (Scala) — human-in-the-loop approval gate. Two agents flanking an UNASSIGNED approval
    # task: DraftAgent produces the candidate reply, PublishAgent runs only once a human completes
    # the gate. The tasks themselves are runtime-owned (like cap-4's SessionMemoryEntity), so only
    # the agents are listed here. See specs/007 research R3.
    "com.gwgs.akkaagentic.approvals.application.DraftAgent",
    "com.gwgs.akkaagentic.approvals.application.PublishAgent",
    # cap-7 (Scala) — the activity coordinator. Delegates to request-based specialists via
    # Delegation.to(...) (the SDK-recommended dynamic-delegation primitive). See specs/009.
    "com.gwgs.akkaagentic.activities.application.ActivityCoordinator"
  ]
}

# The @Setup ServiceSetup class is NOT a component: the SDK's ComponentLocator reads it from
# a separate top-level path `akka.javasdk.service-setup` (sibling of `akka.javasdk.components`)
# as a SINGLE fully-qualified class name — not a list. Confirmed from the SDK bytecode
# (ComponentLocator: getString on `akka.javasdk.service-setup`). Both the runtime and the
# TestKit locate it here, so Bootstrap.onStartup runs in tests too.
akka.javasdk.service-setup = "com.gwgs.akkaagentic.application.Bootstrap"
