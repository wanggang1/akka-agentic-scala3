akka.javasdk {
  agent {
    # Default model for all agents in this service. Other providers can be
    # configured, see https://doc.akka.io/sdk/model-provider-details.html
    #
    # Switch providers at launch without recompiling:
    #   default (Ollama):  mvn compile exec:java
    #   Gemini:            MODEL_PROVIDER=googleai-gemini mvn compile exec:java
    model-provider = ollama
    model-provider = ${?MODEL_PROVIDER}

    googleai-gemini {
      model-name = "gemini-2.5-flash"
      # API key supplied via environment variable; no secrets in source.
      api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    }

    # Local open-source models via Ollama (http://localhost:11434). No API key.
    # Pick a model with reliable tool/function calling — the agents deliver
    # structured output through function-calling tools (@FunctionTool and the
    # AutonomousAgent complete_task tool), so 8B+ Qwen/Llama-3.1 are the safe
    # choices; 4B models trip the onFailure fallback more often.
    ollama {
      provider   = "ollama"
      base-url   = "http://localhost:11434"
      model-name = "qwen3:8b"
      model-name = ${?OLLAMA_MODEL}
    }

    # cap-12 (guardrails) — runtime-enforced governance around the cap-8 docs agent.
    #
    # A guardrail is NOT a component: it is registered here by class-name string and constructed
    # reflectively by the runtime, so it needs no entry in the hand-maintained META-INF descriptor.
    # `agents` is the attachment point; `docs-agent` never names a rule (SC-006).
    guardrails {

      # The SDK already ships this rule fully specified in its own reference.conf — class
      # (SimilarityGuard), category JAILBREAK, threshold 0.75, use-for model-request, and 10 example
      # jailbreak prompts bundled in-jar at guardrail/jailbreak/ — declared but inert because
      # `agents = []`. Enabling it is therefore ONE key, with no copied block and no new dependency:
      # the embedding model the runtime needs (all-MiniLM-L6-v2-q, in-process ONNX) is already on the
      # classpath from cap-8, so this stays fully offline. See research R2.
      "default jailbreak".agents = ["docs-agent"]

      # Response-side, enforcing (cap-12 US2). An answer that points at an external web source is
      # evidence the model reached outside its supplied passages — a proxy for ungroundedness, sound
      # here because the corpus contains no links. `link-markers` is read by the rule from THIS
      # section, so retuning it is a config change, never a recompile (FR-007).
      #
      # The class is a top-level Scala class with a single plain (GuardrailContext) parameter list —
      # the loader's first constructor attempt. See LinkedAnswerGuard's scaladoc for why every part of
      # that shape is load-bearing.
      "linked answer guard" {
        class        = "com.gwgs.akkaagentic.docs.application.LinkedAnswerGuard"
        agents       = ["docs-agent"]
        agent-roles  = []
        category     = HALLUCINATED
        report-only  = false
        use-for      = ["model-response"]
        link-markers = ["http", "www.", "see also:"]
      }

      # Response-side, RECORD-ONLY (cap-12 US3). A verbose answer is worth recording and not worth
      # refusing, so `report-only = true`: the rule still runs and is still reported to logs, metrics
      # and traces, but the answer is delivered. Flipping this one key to `false` turns the same class
      # into an enforcing rule with no source change — which is SC-005, and is proven by a test that
      # overrides exactly this key.
      #
      # The class takes NO constructor parameters — the loader's second, undocumented attempt. It
      # therefore cannot read this section, so its threshold, name and category live as constants in
      # the class and must be kept in step with the two keys below by hand.
      "answer length guard" {
        class       = "com.gwgs.akkaagentic.docs.application.AnswerLengthGuard"
        agents      = ["docs-agent"]
        agent-roles = []
        category    = FORMAT
        report-only = true
        use-for     = ["model-response"]
      }
    }
  }
}

# cap-10 (MCP client) — the Akka service name whose /mcp the McpClientAgent consumes. The loop is
# closed in-process: the agent consumes THIS service's own cap-9 MCP server, so this defaults to this
# service's own name (the Maven artifactId in dev-mode). Override here (or via the env var) only if the
# service is deployed under a different name, so `RemoteMcpTools.fromService(...)` still resolves.
mcp-client {
  # knowledge-service-name = "akka-agentic-scala3"
  knowledge-service-name = ${?KNOWLEDGE_MCP_SERVICE_NAME}
}

# cap-13 (LLM-as-judge evaluation) — the on/off switch for POST /evaluate's judges.
#
# Judges cost model calls: an evaluation is three round-trips (one answer, two verdicts), where an
# ordinary POST /ask is one. That is fine in development and in a test environment and is usually not
# wanted at production scale, so it must be switchable WITHOUT a code change (FR-009). Turning it off
# still answers the question and returns an empty verdict list; the answer path is never the thing
# that breaks.
#
# One mechanism, not two. `ServiceSetup.disabledComponents` is the SDK's own way to switch a component
# off and would disable DeclineJudge — but it cannot disable the ENDPOINT that calls the judges (an
# endpoint is not a component), so this flag would still be needed and the two could disagree. See
# specs/015 research D8.
eval {
  enabled = true
  enabled = ${?EVAL_ENABLED}
}
