akka.javasdk {
  agent {
    # Default model for all agents in this service. Other providers can be
    # configured, see https://doc.akka.io/sdk/model-provider-details.html
    #
    # Switch providers at launch without recompiling:
    #   default (Ollama):  mvn compile exec:java
    #   Gemini:            MODEL_PROVIDER=googleai-gemini mvn compile exec:java
    model-provider = ollama
    model-provider = ${?MODEL_PROVIDER}

    googleai-gemini {
      model-name = "gemini-2.5-flash"
      # API key supplied via environment variable; no secrets in source.
      api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    }

    # Local open-source models via Ollama (http://localhost:11434). No API key.
    # Pick a model with reliable tool/function calling — the agents deliver
    # structured output through function-calling tools (@FunctionTool and the
    # AutonomousAgent complete_task tool), so 8B+ Qwen/Llama-3.1 are the safe
    # choices; 4B models trip the onFailure fallback more often.
    ollama {
      provider   = "ollama"
      base-url   = "http://localhost:11434"
      model-name = "qwen3:8b"
      model-name = ${?OLLAMA_MODEL}
    }

    # cap-12 (guardrails) — runtime-enforced governance around the cap-8 docs agent.
    #
    # A guardrail is NOT a component: it is registered here by class-name string and constructed
    # reflectively by the runtime, so it needs no entry in the hand-maintained META-INF descriptor.
    # `agents` is the attachment point; `docs-agent` never names a rule (SC-006).
    guardrails {

      # The SDK already ships this rule fully specified in its own reference.conf — class
      # (SimilarityGuard), category JAILBREAK, threshold 0.75, use-for model-request, and 10 example
      # jailbreak prompts bundled in-jar at guardrail/jailbreak/ — declared but inert because
      # `agents = []`. Enabling it is therefore ONE key, with no copied block and no new dependency:
      # the embedding model the runtime needs (all-MiniLM-L6-v2-q, in-process ONNX) is already on the
      # classpath from cap-8, so this stays fully offline. See research R2.
      "default jailbreak".agents = ["docs-agent"]

      # Response-side, enforcing (cap-12 US2). An answer that points at an external web source is
      # evidence the model reached outside its supplied passages — a proxy for ungroundedness, sound
      # here because the corpus contains no links. `link-markers` is read by the rule from THIS
      # section, so retuning it is a config change, never a recompile (FR-007).
      #
      # The class is a top-level Scala class with a single plain (GuardrailContext) parameter list —
      # the loader's first constructor attempt. See LinkedAnswerGuard's scaladoc for why every part of
      # that shape is load-bearing.
      "linked answer guard" {
        class        = "com.gwgs.akkaagentic.docs.application.LinkedAnswerGuard"
        agents       = ["docs-agent"]
        agent-roles  = []
        category     = HALLUCINATED
        report-only  = false
        use-for      = ["model-response"]
        link-markers = ["http", "www.", "see also:"]
      }

      # Response-side, RECORD-ONLY (cap-12 US3). A verbose answer is worth recording and not worth
      # refusing, so `report-only = true`: the rule still runs and is still reported to logs, metrics
      # and traces, but the answer is delivered. Flipping this one key to `false` turns the same class
      # into an enforcing rule with no source change — which is SC-005, and is proven by a test that
      # overrides exactly this key.
      #
      # The class takes NO constructor parameters — the loader's second, undocumented attempt. It
      # therefore cannot read this section, so its threshold, name and category live as constants in
      # the class and must be kept in step with the two keys below by hand.
      "answer length guard" {
        class       = "com.gwgs.akkaagentic.docs.application.AnswerLengthGuard"
        agents      = ["docs-agent"]
        agent-roles = []
        category    = FORMAT
        report-only = true
        use-for     = ["model-response"]
      }
    }
  }
}

# cap-14 (streaming) — the two guards the streaming surface puts on an agent's token stream.
#
# These are not belt-and-braces. MEASURED on SDK 3.6.3 (specs/016 research Q-A(2)): when a model call
# fails BEFORE the first token, the token stream produces no tokens, no completion and no failure —
# nothing, ever. Still silent after 240 s, well past the provider's own budget (response-timeout 1m x
# 3 attempts). Without `first-token-timeout` a caller holds an open connection indefinitely, so
# FR-006 ("a failure before delivery reaches the caller as a single clear failure") would be
# unsatisfiable. `idle-timeout` is the same hazard after streaming has begun: a stall ends the body
# instead of leaving it dangling, which is the only signal available once bytes are already flowing.
#
# A bad value (absent, malformed, zero, negative) falls back to the default rather than timing every
# request out instantly. The integration tests override these downwards; the defaults are sized for
# real callers on a local model.
streaming {
  first-token-timeout = 60s
  first-token-timeout = ${?STREAMING_FIRST_TOKEN_TIMEOUT}

  idle-timeout = 30s
  idle-timeout = ${?STREAMING_IDLE_TIMEOUT}
}

# cap-10 (MCP client) — the Akka service name whose /mcp the McpClientAgent consumes. The loop is
# closed in-process: the agent consumes THIS service's own cap-9 MCP server, so this defaults to this
# service's own name (the Maven artifactId in dev-mode). Override here (or via the env var) only if the
# service is deployed under a different name, so `RemoteMcpTools.fromService(...)` still resolves.
mcp-client {
  # knowledge-service-name = "akka-agentic-scala3"
  knowledge-service-name = ${?KNOWLEDGE_MCP_SERVICE_NAME}
}

# cap-13 (LLM-as-judge evaluation) — the on/off switch for POST /evaluate's judges.
#
# Judges cost model calls: an evaluation is three round-trips (one answer, two verdicts), where an
# ordinary POST /ask is one — so they must be switchable WITHOUT a code change (FR-009). An LLM judge
# is a regression instrument (a pass rate over a fixed question set, compared across a change), not a
# request-path quality gate; where production traffic is judged at all, it is sampled and out of band.
# This synchronous surface exists only because cap-8 offers nothing to consume (research R4), so read
# this flag as a coarse switch on a demonstration surface, not a production cost dial. Turning it off
# still answers the question and returns an empty verdict list; the answer path is never the thing
# that breaks.
#
# One mechanism, not two. `ServiceSetup.disabledComponents` is the SDK's own way to switch a component
# off and would disable DeclineJudge — but it cannot disable the ENDPOINT that calls the judges (an
# endpoint is not a component), so this flag would still be needed and the two could disagree. See
# specs/015 research D8.
#
# `judge-timeout` bounds ONE judge: past it, that judge's verdict is `errored` ("the judge did not
# respond within 60s") and the other judge still reports. The two run concurrently, so it also bounds
# the judging half of an evaluation. It is a client-side deadline — the abandoned model call keeps
# running until the provider's own response-timeout (1m per attempt, 2 retries) ends it. The ANSWER
# call is deliberately not bounded here: a deadline on it would turn a slow answer into a failed call,
# so the provider's timeout governs it, and a timed-out answer is `not-applicable`, never a decline.
eval {
  enabled = true
  enabled = ${?EVAL_ENABLED}

  judge-timeout = 60s
  judge-timeout = ${?EVAL_JUDGE_TIMEOUT}
}

# cap-15 (scheduled reminders) — how many times a reminder's work may be attempted before the reminder is
# recorded as `failed` and left alone (FR-008).
#
# Passed as `maxRetries` to the FOUR-argument `createSingleTimer`, always. The three-argument form was
# measured still retrying at 30 seconds with widening gaps (specs/017 research Q-D), so there is no
# default to fall back on, and no value of this key makes retrying unbounded: it must be 1..10, and the
# service refuses to schedule with anything else.
#
# The same number bounds the work from the INSIDE too. The SDK does not tell a timed action which attempt
# it is on, and a timer that exhausts its retries tells nobody — so the action counts its own attempts
# and, on the last one, records the failure and stops cleanly rather than leave the reminder reading
# `pending` for ever. The timer's maxRetries is then a backstop, not the only line.
reminders {
  max-retries = 2
  max-retries = ${?REMINDERS_MAX_RETRIES}
}

# cap-16 (reacting to activity — Consumer). Local dev only: where a consumer's `@Produce.ToTopic` messages go
# when there is no message broker.
#
# Measured (specs/018 research Q-C): with the default `none`, ONE consumer declaring @Produce.ToTopic makes the
# whole service refuse to start —
#   AK-00406 Component [...] has declared a message destination topic [...], but no topic support is configured.
# — so `mvn compile exec:java` would fail for EVERY capability, not just this one. The TestKit mocks topics, so
# the test suite never shows it. `logging` logs each produced message and drops it instead: the service starts,
# and a local run can see what would have been published — but only after un-silencing the sink. It logs at INFO
# under `kalix.runtime.eventing.LoggingEventingSupport.<topic>`, and the dev-mode logback config silences the
# whole `kalix` tree at WARN, so the messages are emitted and never printed; `include-dev-loggers.xml` re-enables
# that one logger. A deployed service needs a real broker configured in the Akka project (Kafka or Google
# Pub/Sub); this key is dev-mode only and does not configure one.
akka.javasdk.dev-mode.eventing.support = "logging"

# cap-16 (reacting to activity — Consumer). The activity feed's bounds.
#
# `max-attempts` is the number of times ONE delivery may be attempted before it is set aside and the stream
# is allowed to move on. It exists because of a measurement (specs/018 research Q-D): a handler that throws
# is redelivered **without limit** — schedule in ms 0, 277, 789, 1719, 3419, 6985, 13976, 27611, doubling —
# and while that happens **every other user's changes wait behind it**. A handler that gives up and returns
# done() unblocked the stream within 1 ms. The SDK offers no attempt number and `ce-id` changes on every
# redelivery, so attempts are counted per (user, state fingerprint).
#
# The retention bounds keep the in-process feed from growing without limit — capability 15 shipped a store
# that never evicted and had to say so after review (README §17). Out-of-range values are refused at startup
# of the component that reads them, as a config error rather than a caller's 400 (limitations §7d).
feed {
  max-attempts = 3
  max-attempts = ${?FEED_MAX_ATTEMPTS}

  max-entries = 500
  max-entries = ${?FEED_MAX_ENTRIES}

  max-set-asides = 100
  max-set-asides = ${?FEED_MAX_SET_ASIDES}

  max-users = 1000
  max-users = ${?FEED_MAX_USERS}
}
