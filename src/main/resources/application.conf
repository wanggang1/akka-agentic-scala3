akka.javasdk {
  agent {
    # Default model for all agents in this service. Other providers can be
    # configured, see https://doc.akka.io/sdk/model-provider-details.html
    #
    # Switch providers at launch without recompiling:
    #   default (Ollama):  mvn compile exec:java
    #   Gemini:            MODEL_PROVIDER=googleai-gemini mvn compile exec:java
    model-provider = ollama
    model-provider = ${?MODEL_PROVIDER}

    googleai-gemini {
      model-name = "gemini-2.5-flash"
      # API key supplied via environment variable; no secrets in source.
      api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    }

    # Local open-source models via Ollama (http://localhost:11434). No API key.
    # Pick a model with reliable tool/function calling — the agents deliver
    # structured output through function-calling tools (@FunctionTool and the
    # AutonomousAgent complete_task tool), so 8B+ Qwen/Llama-3.1 are the safe
    # choices; 4B models trip the onFailure fallback more often.
    ollama {
      provider   = "ollama"
      base-url   = "http://localhost:11434"
      model-name = "qwen3:8b"
      model-name = ${?OLLAMA_MODEL}
    }
  }
}
